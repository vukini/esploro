name: test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sbcl, and Emacs for the window's tests
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends sbcl emacs-nox
      - name: the core's tests (SBCL) and the window's (Emacs in batch, no X)
        run: make test
